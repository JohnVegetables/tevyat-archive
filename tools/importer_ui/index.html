<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teyvat Archive Importer</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f1c; --bg2:#10162a; --panel:#151c33; --panel2:#1b2340; --line:#26304f; --line2:#334068;
  --text:#ece8dc; --muted:#99a1bb; --dim:#6b7391;
  --gold:#d9b46a; --gold2:#f1d595; --goldglow:rgba(217,180,106,.16);
  --ok:#6fd3a5; --warn:#f0b35a; --bad:#ef6b6b;
  --anemo:#5fd3b8; --geo:#f1b94a; --electro:#b07ae8; --dendro:#97c94f; --hydro:#4aa8f0; --pyro:#f0703f; --cryo:#9fdcf0; --none:#8a90a8;
  --r:14px; --font:"Inter","Segoe UI",system-ui,sans-serif; --display:"Cinzel",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 85% -10%,#1d2547 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#1a1f3a 0%,transparent 55%),var(--bg);
  color:var(--text);font:14px/1.5 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:260px 1fr;height:100vh}
.side{background:linear-gradient(180deg,rgba(21,28,51,.92),rgba(13,18,34,.92));border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 18px}
.brand{display:flex;gap:12px;align-items:center;margin:0 6px 34px}
.brand svg{flex:none;filter:drop-shadow(0 0 10px var(--goldglow))}
.brand h1{font:700 19px/1.1 var(--display);letter-spacing:.06em;margin:0;color:var(--gold2)}
.brand p{margin:3px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;color:var(--muted);transition:.2s}
.step:hover{background:rgba(255,255,255,.03);color:var(--text)}
.step.on{background:linear-gradient(90deg,rgba(217,180,106,.14),rgba(217,180,106,.02));border-color:rgba(217,180,106,.35);color:var(--text)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-weight:600;font-size:12px;flex:none;transition:.2s}
.step.on .n{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 4px var(--goldglow)}
.step.done .n{background:var(--gold);border-color:var(--gold);color:#1a1405}
.step b{display:block;font-weight:600;font-size:14px}
.step small{display:block;font-size:12px;color:var(--dim)}
.side .foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);font-size:12px;color:var(--muted);background:rgba(255,255,255,.02)}
.pill.gold{border-color:rgba(217,180,106,.45);color:var(--gold2)}
.pill.ok{border-color:rgba(111,211,165,.4);color:var(--ok)}
.pill.warn{border-color:rgba(240,179,90,.45);color:var(--warn)}
.pill.bad{border-color:rgba(239,107,107,.45);color:var(--bad)}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.head{padding:28px 36px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.head h2{font:700 26px/1.2 var(--display);letter-spacing:.03em;margin:0}
.head p{margin:6px 0 0;color:var(--muted);max-width:640px}
.body{flex:1;overflow:auto;padding:4px 36px 30px}
.body::-webkit-scrollbar,.drawer .scroll::-webkit-scrollbar,.pane::-webkit-scrollbar,.right::-webkit-scrollbar{width:10px}
.body::-webkit-scrollbar-thumb,.drawer .scroll::-webkit-scrollbar-thumb,.pane::-webkit-scrollbar-thumb,.right::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:content-box}
.bar{border-top:1px solid var(--line);background:rgba(11,15,28,.75);backdrop-filter:blur(10px);padding:14px 36px;display:flex;align-items:center;gap:14px}
.bar .sum{color:var(--muted);flex:1}
.bar .sum b{color:var(--text)}
.btn{border:1px solid var(--line2);background:var(--panel);padding:10px 18px;border-radius:11px;cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--gold);background:var(--panel2)}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1d1606;border-color:transparent;box-shadow:0 6px 24px -6px var(--goldglow)}
.btn.primary:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.ghost{background:none}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;pointer-events:none}
.card{background:linear-gradient(180deg,rgba(27,35,64,.8),rgba(21,28,51,.8));border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center}
.input{flex:1;background:var(--bg2);border:1px solid var(--line2);border-radius:11px;padding:11px 14px;outline:none;transition:.15s;min-width:0}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--goldglow)}
.grid2{display:grid;grid-template-columns:1fr 240px;gap:16px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin:28px 0 12px;font-weight:600}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tier{position:relative;text-align:left;cursor:pointer;background:linear-gradient(180deg,rgba(27,35,64,.7),rgba(21,28,51,.7));border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:.2s}
.tier:hover{border-color:var(--line2);transform:translateY(-2px)}
.tier.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 30px -12px var(--goldglow)}
.tier .t{font:700 17px var(--display);letter-spacing:.06em}
.tier .d{color:var(--muted);font-size:13px;margin:6px 0 14px;min-height:40px}
.tier .gauge{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-bottom:12px}
.tier .gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.tier .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--dim)}
.tier .stats b{display:block;color:var(--text);font-size:14px}
.tier .specs{display:flex;gap:14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.tier .specs b{color:var(--muted);font-weight:600}
.tier .badge{position:absolute;top:-10px;right:14px}
.tier .radio{position:absolute;top:18px;right:18px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line2)}
.tier.on .radio{border-color:var(--gold);background:radial-gradient(circle,var(--gold) 45%,transparent 50%)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;position:sticky;top:0;z-index:3;padding:10px 0;background:linear-gradient(180deg,var(--bg) 70%,transparent)}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}
.search .input{padding-left:38px;width:100%}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line2);border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--bg2);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:.15s}
.chip:hover{color:var(--text)}
.chip.on{border-color:currentColor;color:var(--c,var(--gold2));background:rgba(255,255,255,.04)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--none));box-shadow:0 0 5px color-mix(in srgb,var(--c,transparent) 60%,transparent)}
select.input{flex:none;padding:8px 12px;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{position:relative;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 14px;background:linear-gradient(180deg,rgba(27,35,64,.75),rgba(19,25,46,.75));transition:.18s;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:60px;background:radial-gradient(120px 60px at 50% 0,color-mix(in srgb,var(--c) 18%,transparent),transparent);pointer-events:none}
.tile:hover{transform:translateY(-2px);border-color:var(--line2)}
.tile.on{border-color:color-mix(in srgb,var(--c) 60%,var(--gold));box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 10px 24px -16px var(--c)}
.tile:not(.on){opacity:.62}
.tile:not(.on):hover{opacity:.9}
.av{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--display);color:#fff;position:relative;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 80%,#fff 20%),color-mix(in srgb,var(--c) 55%,#000 45%));box-shadow:0 0 0 3px var(--bg2),0 0 0 4px color-mix(in srgb,var(--c) 55%,transparent),0 6px 16px -8px var(--c);text-shadow:0 1px 6px rgba(0,0,0,.4)}
.tile .nm{margin-top:12px;font-weight:600;font-size:14px;line-height:1.25}
.tile .tt{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;min-height:18px}
.tile .meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--line)}
.check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;transition:.15s;background:var(--bg2)}
.tile.on .check{background:var(--gold);border-color:var(--gold)}
.tile.on .check svg{opacity:1}
.check svg{opacity:0}
.quill{position:absolute;top:10px;left:10px;border:1px solid var(--line2);background:var(--bg2);border-radius:8px;padding:3px 7px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;gap:4px;align-items:center;opacity:0;transition:.15s}
.tile:hover .quill,.quill.has{opacity:1}
.quill.has{color:var(--gold2);border-color:rgba(217,180,106,.5)}
.quill:hover{color:var(--text);border-color:var(--gold)}
.empty{padding:60px;text-align:center;color:var(--dim)}
.scrim{position:fixed;inset:0;background:rgba(4,6,14,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:linear-gradient(180deg,#18203c,#11172b);border-left:1px solid var(--line2);transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:11;display:flex;flex-direction:column;box-shadow:-30px 0 60px -20px #000}
.drawer.on{transform:none}
.drawer .top{padding:26px 26px 18px;display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--line)}
.drawer .top h3{margin:0;font:700 21px var(--display)}
.drawer .top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.drawer .scroll{flex:1;overflow:auto;padding:22px 26px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);font-weight:600;margin:0 0 8px}
.quote{border-left:3px solid var(--gold);background:rgba(217,180,106,.06);padding:14px 16px;border-radius:0 12px 12px 0;color:#d9d4c4;white-space:pre-wrap;font-size:14px}
textarea.input{width:100%;min-height:170px;resize:vertical;line-height:1.55}
.hint{font-size:12px;color:var(--dim);margin-top:8px}
.hint code{background:var(--bg2);border:1px solid var(--line2);padding:1px 6px;border-radius:6px;color:var(--gold2)}
.drawer .actions{padding:16px 26px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.toggle{display:flex;align-items:flex-start;gap:12px;cursor:pointer;user-select:none}
.toggle input{display:none}
.sw{flex:none;width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;transition:.2s;margin-top:1px}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#c9cde0;transition:.2s}
.toggle input:checked+.sw{background:var(--gold)}
.toggle input:checked+.sw::after{left:20px;background:#1d1606}
.toggle b{display:block;font-weight:600}
.toggle small{color:var(--muted);font-size:12.5px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.book{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(21,28,51,.7);cursor:pointer;transition:.15s}
.book:hover{border-color:var(--line2)}
.book.on{border-color:rgba(217,180,106,.5);background:linear-gradient(90deg,rgba(217,180,106,.1),rgba(21,28,51,.7))}
.book .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line2);flex:none;color:var(--gold2)}
.book .bt{flex:1;min-width:0}
.book .bt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .bt small{color:var(--dim);font-size:12px}
.book .check{position:static}
.book.on .check{background:var(--gold);border-color:var(--gold)}
.book.on .check svg{opacity:1}
details.more{margin-top:26px;border:1px solid var(--line);border-radius:var(--r);background:rgba(16,22,42,.6)}
details.more summary{cursor:pointer;padding:16px 18px;list-style:none;display:flex;align-items:center;gap:10px;font-weight:600}
details.more summary::-webkit-details-marker{display:none}
details.more summary .chev{transition:.2s;color:var(--muted)}
details.more[open] summary .chev{transform:rotate(90deg)}
details.more .inner{padding:0 18px 18px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:18px}
.stat .k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.stat .v{font:700 28px/1.2 var(--display);margin-top:6px;color:var(--gold2)}
.stat .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.stat .s.path{word-break:break-all}
.notice{display:flex;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid;margin-top:12px;align-items:flex-start}
.notice.warn{border-color:rgba(240,179,90,.4);background:rgba(240,179,90,.07)}
.notice.bad{border-color:rgba(239,107,107,.4);background:rgba(239,107,107,.07)}
.notice.ok{border-color:rgba(111,211,165,.4);background:rgba(111,211,165,.07)}
.notice b{display:block}
.notice small{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:16px}
.big{padding:16px 30px;font-size:16px;border-radius:14px}
.finish{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 20px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(217,180,106,.18),transparent 70%);border:2px solid var(--gold);box-shadow:0 0 28px var(--goldglow);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.finish h3{font:700 26px var(--display);margin:22px 0 6px}
.finish p{color:var(--muted);max-width:520px}
pre.log{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:220px;overflow:auto;color:var(--muted);font-size:12px;text-align:left;width:100%;max-width:640px}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.25);border-top-color:#1d1606;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:84px;left:50%;transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:11px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.av.img{background-size:cover;background-position:50% 18%;color:transparent;text-shadow:none}
.portrait{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.pframe{width:120px;height:180px;border-radius:14px;flex:none;border:1px solid var(--line2);background:var(--bg2) center 18%/cover no-repeat;display:grid;place-items:center;font:700 34px var(--display);color:var(--dim);overflow:hidden}
.pbtns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pbtns p{margin:0 0 4px;color:var(--muted);font-size:12.5px}
.modal{position:fixed;inset:0;z-index:30;display:none;background:rgba(4,6,14,.72);backdrop-filter:blur(4px)}
.modal.on{display:flex;animation:fade .2s ease}
.picker{margin:auto;width:min(1180px,94vw);height:min(820px,92vh);background:linear-gradient(180deg,#18203c,#10162b);border:1px solid var(--line2);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px #000}
.picker .ph{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.picker .ph h3{margin:0;font:700 19px var(--display);flex:1}
.picker .pb{flex:1;display:grid;grid-template-columns:1fr 360px;min-height:0}
.picker .left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.picker .tabs{display:flex;gap:4px;padding:12px 18px 0}
.picker .tabs button{border:0;background:none;padding:9px 14px;border-radius:10px 10px 0 0;color:var(--muted);cursor:pointer;font-weight:600;border-bottom:2px solid transparent}
.picker .tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
.picker .pane{flex:1;overflow:auto;padding:16px 18px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gal button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--bg2);aspect-ratio:2/3;position:relative;transition:.15s}
.gal button:hover{border-color:var(--gold);transform:translateY(-2px)}
.gal img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.gal small{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;font-size:10.5px;color:#ddd;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop{border:2px dashed var(--line2);border-radius:16px;padding:34px;text-align:center;color:var(--muted);transition:.15s}
.drop.over{border-color:var(--gold);background:rgba(217,180,106,.06);color:var(--text)}
.drop b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.right{display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px;min-height:0;overflow:auto}
.crop{width:300px;height:450px;border-radius:14px;overflow:hidden;position:relative;background:var(--bg2);border:1px solid var(--line2);cursor:grab;flex:none;touch-action:none}
.crop.dragging{cursor:grabbing}
.crop img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
.cempty{position:absolute;inset:0;display:grid;place-items:center;padding:30px;color:var(--dim);text-align:center;font-size:13px;line-height:1.6}
.crop::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border-radius:14px}
.zoom{width:300px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.zoom input{flex:1;accent-color:var(--gold)}
.spin2{width:26px;height:26px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--gold);animation:spin .8s linear infinite;margin:40px auto}
.upd{display:none;flex-direction:column;gap:6px;margin:0 4px 14px;padding:14px;border-radius:12px;border:1px solid rgba(217,180,106,.45);background:linear-gradient(180deg,rgba(217,180,106,.12),rgba(217,180,106,.03))}
.upd.on{display:flex}
.upd b{color:var(--gold2)}
.upd span{color:var(--muted);font-size:12.5px}
.upd .btn{align-self:flex-start;margin-top:4px}
.lost{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(4,6,14,.8);backdrop-filter:blur(4px)}
.lost.on{display:grid}
.lost>div{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:26px 30px;max-width:420px;text-align:center}
.lost b{font:700 19px var(--display);color:var(--gold2)}
.lost p{color:var(--muted);margin:10px 0 0}
@media (max-width:1100px){.tiers{grid-template-columns:repeat(2,1fr)}.stats4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="#d9b46a" stroke-opacity=".5"/><path d="M20 3l3.2 13.8L37 20l-13.8 3.2L20 37l-3.2-13.8L3 20l13.8-3.2z" fill="url(#g)"/><circle cx="20" cy="20" r="3" fill="#0b0f1c"/><defs><linearGradient id="g" x1="3" y1="3" x2="37" y2="37"><stop stop-color="#f6dfa4"/><stop offset="1" stop-color="#b88c3e"/></linearGradient></defs></svg>
      <div><h1>Teyvat Archive</h1><p>SillyTavern Importer</p></div>
    </div>
    <nav class="steps" id="steps"></nav>
    <div class="upd" id="upd"></div>
    <div class="foot"><span>Fan project · <span id="ver"></span></span><span class="pill gold" id="cutoff">v7.1</span></div>
  </aside>
  <main class="main">
    <header class="head"><div><h2 id="title"></h2><p id="desc"></p></div><div id="headx"></div></header>
    <section class="body" id="body"><div class="empty" style="padding-top:140px"><div class="ring" style="margin:0 auto 20px;width:64px;height:64px"><svg width="26" height="26" viewBox="0 0 40 40"><path d="M20 3l3.2 13.8L37 20l-13.8 3.2L20 37l-3.2-13.8L3 20l13.8-3.2z" fill="#d9b46a"/></svg></div>Opening the archive…</div></section>
    <footer class="bar">
      <div class="sum" id="sum"></div>
      <button class="btn ghost" id="back">Back</button>
      <button class="btn primary" id="next">Continue</button>
    </footer>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>
<div class="lost" id="lost"><div><b>The importer has stopped</b><p>Close this window and open the importer again. Your choices are saved.</p></div></div>
<div class="modal" id="picker"></div>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,body){
  let r;
  try{r=await fetch(p,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}
  catch(e){lost();throw e}
  try{return await r.json()}catch(e){return {ok:false,error:`Unexpected reply from the importer (${r.status})`}}
}
function lost(){$("#lost").classList.add("on")}
const ELEMENTS=["Anemo","Geo","Electro","Dendro","Hydro","Pyro","Cryo"];
const ecol=e=>`var(--${(e||"none").toLowerCase()})`;
const pl=(n,w)=>`${n} ${w}${n===1?"":"s"}`;
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"k":String(n??"–");
const ICON={check:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1d1606" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  quill:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>',
  book:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5M8 7h7"/></svg>',
  search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  folder:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
  chev:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>',
  done:'<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#f1d595" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  warn:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f0b35a" stroke-width="2"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>',
  okc:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6fd3a5" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>'};

const S={step:0,cfg:null,tiers:[],bundle:null,cards:new Set(),books:new Set(),f:{q:"",kind:"All",el:null,nation:""},drawer:null,stcheck:null,importing:false,result:null};
const TIER_SPECS={LITE:["8k+","6 GB+"],STANDARD:["16k+","12–16 GB"],LARGE:["32k+","16–24 GB"],ULTRA:["32k+","24 GB+"]};
const STEPS=[["Setup","Folder & tier"],["Characters","Who to bring"],["Lorebooks","World knowledge"],["Import","Review & install"]];

let saveT; function save(){clearTimeout(saveT);saveT=setTimeout(()=>api("/api/config",payload()),300)}
function payload(){return {...S.cfg,tier:S.cfg.tier,cards:[...S.cards],books:[...S.books]}}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1800)}

async function init(){
  const st=await api("/api/state"); S.cfg=st.config; S.tiers=st.tiers; $("#cutoff").textContent="Canon "+st.cutoff;
  if(!S.tiers.find(t=>t.id===S.cfg.tier)) S.cfg.tier=(S.tiers.find(t=>t.id==="STANDARD")||S.tiers[0]).id;
  await loadTier(); checkST();
  const [page,edit]=location.hash.slice(1).split("/edit/"); const i=HASH.indexOf(page); if(i>0) S.step=i;
  render(); if(edit) openDrawer(decodeURIComponent(edit));
  const ping=()=>api("/api/ping",{}).catch(()=>{}); setInterval(ping,5000); ping();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden) ping()});
  addEventListener("pagehide",()=>navigator.sendBeacon("/api/bye"));
  api("/api/update").then(u=>{$("#ver").textContent="v"+u.current; if(u.newer){$("#upd").innerHTML=`<b>Update available</b><span>Version ${esc(u.latest)} is out.</span><button class="btn sm primary" id="updgo">Download</button>`; $("#upd").classList.add("on"); $("#updgo").onclick=()=>window.open(u.url,"_blank")}}).catch(()=>{});
}
async function loadTier(){
  S.bundle=await api("/api/bundle?tier="+encodeURIComponent(S.cfg.tier));
  const ids=new Set(S.bundle.cards.map(c=>c.id)), bks=new Set(S.bundle.books.map(b=>b.book));
  S.cards=new Set(S.cfg.cards?S.cfg.cards.filter(i=>ids.has(i)):[...ids]);
  S.books=new Set(S.cfg.books?S.cfg.books.filter(b=>bks.has(b)):S.bundle.books.filter(b=>b.topic).map(b=>b.book));
}
async function checkST(){S.stcheck=S.cfg.st?await api("/api/check",{...payload()}):null; if(S.step===0||S.step===3) render(true)}

const HASH=["setup","characters","lorebooks","import"];
function render(keepScroll){
  history.replaceState(null,"","#"+HASH[S.step]);
  const sc=$("#body").scrollTop;
  $("#steps").innerHTML=STEPS.map(([t,s],i)=>`<button class="step ${i===S.step?"on":""} ${i<S.step?"done":""}" data-i="${i}"><span class="n">${i<S.step?ICON.check:i+1}</span><span><b>${t}</b><small>${s}</small></span></button>`).join("");
  $("#steps").onclick=e=>{const b=e.target.closest(".step"); if(b){S.step=+b.dataset.i; S.result=null; render()}};
  [renderSetup,renderChars,renderBooks,renderImport][S.step]();
  const g=Object.keys(S.cfg.greetings||{}).filter(k=>S.cards.has(k)&&S.cfg.greetings[k].trim()).length;
  summary();
  $("#back").style.visibility=S.step?"visible":"hidden";
  $("#next").style.display=S.step===3?"none":"";
  $("#next").textContent=S.step===2?"Review":"Continue";
  if(keepScroll){$("#body").scrollTop=sc; document.querySelectorAll("#body .fade").forEach(e=>e.classList.remove("fade"))} else $("#body").scrollTop=0;
}
$("#back").onclick=()=>{S.step--;S.result=null;render()};
$("#next").onclick=()=>{S.step++;render(); if(S.step===3) checkST()};

function summary(){const g=Object.keys(S.cfg.greetings||{}).filter(k=>S.cards.has(k)&&S.cfg.greetings[k].trim()).length;
  $("#sum").innerHTML=`<b>${S.cfg.tier}</b> · ${pl(S.cards.size,"character").replace(/^(\d+)/,"<b>$1</b>")}${g?` (<b>${g}</b> with your greeting)`:""} · ${pl(S.books.size,"lorebook").replace(/^(\d+)/,"<b>$1</b>")}`}
function head(t,d,x=""){$("#title").textContent=t;$("#desc").textContent=d;$("#headx").innerHTML=x}

function renderSetup(){
  head("Welcome, Traveler","Point the importer at your SillyTavern folder and choose how much lore each character carries.");
  const c=S.stcheck, status=!S.cfg.st?`<span class="pill">Not set</span>`:!c?`<span class="pill">Checking…</span>`:c.ok?`<span class="pill ok">● SillyTavern found</span>`:`<span class="pill bad">● Not a SillyTavern folder</span>`;
  const maxTok=Math.max(...S.tiers.map(t=>t.totals.world_info_tokens||0));
  $("#body").innerHTML=`<div class="fade">
   <div class="grid2">
    <div class="card"><div class="row" style="justify-content:space-between"><h3>SillyTavern folder</h3>${status}</div>
      <p class="sub">The folder that contains <b>server.js</b>.</p>
      <div class="row"><input class="input" id="st" placeholder="C:\\…\\SillyTavern" value="${esc(S.cfg.st)}"><button class="btn" id="browse">${ICON.folder} Browse</button></div></div>
    <div class="card"><h3>Profile</h3><p class="sub">Leave as is unless you use accounts.</p><input class="input" id="user" style="width:100%" value="${esc(S.cfg.user)}"></div>
   </div>
   <div class="section-title">Choose a tier</div>
   <div class="tiers">${S.tiers.map(t=>{const tt=t.totals||{};return `<button class="tier ${t.id===S.cfg.tier?"on":""}" data-t="${t.id}">
     ${t.id==="STANDARD"?'<span class="pill gold badge" style="background:#1b2340">Recommended</span>':""}<span class="radio"></span>
     <div class="t">${esc(t.id)}</div><div class="d">${esc(t.info)}</div>
     <div class="gauge"><i style="width:${Math.max(6,100*(tt.world_info_tokens||0)/maxTok)}%"></i></div>
     <div class="stats"><span><b>${tt.cards??"–"}</b>characters</span><span><b>${fmt(tt.world_info_entries)}</b>lore entries</span></div>
     ${TIER_SPECS[t.id]?`<div class="specs"><span>Context <b>${TIER_SPECS[t.id][0]}</b></span><span>VRAM <b>${TIER_SPECS[t.id][1]}</b></span></div>`:""}</button>`}).join("")}</div>
   <p class="hint" style="margin-top:16px">VRAM is a rough guide for running the model locally with that much context. Tip: you can switch tiers any time. Importing again replaces the lorebooks with the new tier's versions.</p></div>`;
  $("#st").onchange=e=>{S.cfg.st=e.target.value.trim();save();checkST();render(true)};
  $("#user").onchange=e=>{S.cfg.user=e.target.value.trim()||"default-user";save();checkST()};
  $("#browse").onclick=async()=>{const r=await api("/api/browse",{}); if(r.path){S.cfg.st=r.path;save();S.stcheck=null;render(true);checkST()}};
  document.querySelectorAll(".tier").forEach(b=>b.onclick=async()=>{S.cfg.cards=[...S.cards];S.cfg.books=[...S.books];S.cfg.tier=b.dataset.t;await loadTier();save();render(true)});
}

function visibleCards(){const f=S.f,q=f.q.toLowerCase();return S.bundle.cards.filter(c=>(!q||c.name.toLowerCase().includes(q)||(c.title||"").toLowerCase().includes(q))&&(f.kind==="All"||c.kind===f.kind)&&(!f.el||c.element===f.el)&&(!f.nation||c.nation===f.nation))}
function renderChars(){
  head("Choose your characters","Click a card to include or exclude it. Click Edit to give anyone your own greeting or a portrait.");
  const nations=[...new Set(S.bundle.cards.map(c=>c.nation).filter(Boolean))].sort();
  const f=S.f;
  $("#body").innerHTML=`<div class="tools">
     <div class="search">${ICON.search}<input class="input" id="q" placeholder="Search characters or titles…" value="${esc(f.q)}"></div>
     <div class="seg" id="kind">${["All","Playable","NPC","Historical"].map(k=>`<button class="${f.kind===k?"on":""}" data-k="${k}">${k}</button>`).join("")}</div>
     <select class="input" id="nation"><option value="">All regions</option>${nations.map(n=>`<option ${f.nation===n?"selected":""}>${esc(n)}</option>`).join("")}</select>
     <span style="flex:1"></span><span class="pill" id="shown"></span>
     <div style="flex-basis:100%;height:0"></div>
     <div class="chips" id="els">${ELEMENTS.map(e=>`<button class="chip ${f.el===e?"on":""}" style="--c:${ecol(e)}" data-e="${e}"><span class="dot"></span>${e}</button>`).join("")}</div>
     <span style="flex:1"></span>
     <button class="btn sm" id="all">Select shown</button><button class="btn sm ghost" id="none">Clear shown</button>
   </div><div class="tiles fade" id="tiles"></div>`;
  drawTiles();
  $("#q").oninput=e=>{f.q=e.target.value;drawTiles()};
  $("#kind").onclick=e=>{const b=e.target.closest("button");if(b){f.kind=b.dataset.k;render(true)}};
  $("#nation").onchange=e=>{f.nation=e.target.value;drawTiles()};
  $("#els").onclick=e=>{const b=e.target.closest(".chip");if(b){f.el=f.el===b.dataset.e?null:b.dataset.e;render(true)}};
  $("#all").onclick=()=>{visibleCards().forEach(c=>S.cards.add(c.id));save();drawTiles();render(true)};
  $("#none").onclick=()=>{visibleCards().forEach(c=>S.cards.delete(c.id));save();drawTiles();render(true)};
}
function avatar(c,cls="av"){return c.art?`<div class="${cls} img" style="--c:${ecol(c.element)};background-image:url('${c.art}')"></div>`:`<div class="${cls}" style="--c:${ecol(c.element)}">${esc(initials(c.name))}</div>`}
function initials(n){const w=n.replace(/[^\p{L}\s'-]/gu,"").split(/\s+/).filter(Boolean);return (w.length>1?w[0][0]+w[w.length-1][0]:n.slice(0,2)).toUpperCase()}
function drawTiles(){
  const v=visibleCards(), G=S.cfg.greetings||{};
  if($("#shown")) $("#shown").textContent=`${v.length} shown · ${v.filter(c=>S.cards.has(c.id)).length} selected`;
  $("#tiles").innerHTML=v.length?v.map(c=>`<div class="tile ${S.cards.has(c.id)?"on":""}" style="--c:${ecol(c.element)}" data-id="${c.id}">
     <button class="quill ${G[c.id]?.trim()||c.art?"has":""}" data-g="${c.id}" title="Edit greeting and portrait">${ICON.quill}Edit</button>
     <span class="check">${ICON.check}</span>
     ${avatar(c)}
     <div class="nm">${esc(c.name)}</div><div class="tt">${esc(c.title||"")}</div>
     <div class="meta">${c.element?`<span class="tag" style="color:${ecol(c.element)}">${c.element}</span>`:""}${c.nation?`<span class="tag">${esc(c.nation)}</span>`:""}${c.kind!=="Playable"?`<span class="tag">${c.kind}</span>`:""}</div></div>`).join(""):`<div class="empty">No characters match these filters.</div>`;
  $("#tiles").onclick=e=>{const g=e.target.closest("[data-g]");if(g){openDrawer(g.dataset.g);return}
    const t=e.target.closest(".tile");if(!t)return;const id=t.dataset.id;S.cards.has(id)?S.cards.delete(id):S.cards.add(id);t.classList.toggle("on");save();
    summary(); const v2=visibleCards(); $("#shown").textContent=`${v2.length} shown · ${v2.filter(c=>S.cards.has(c.id)).length} selected`};
}
async function openDrawer(id){
  const c=S.bundle.cards.find(x=>x.id===id); S.drawer=id;
  const D=$("#drawer"); S.cfg.greetings=S.cfg.greetings||{};
  D.innerHTML=`<div class="top">${avatar(c)}<div><h3>${esc(c.name)}</h3><p>${esc(c.title||c.kind)}</p></div></div>
   <div class="scroll"><p class="label">Portrait</p>
   <div class="portrait"><div class="pframe" id="pf" style="${c.art?`background-image:url('${c.art}')`:""}">${c.art?"":esc(initials(c.name))}</div>
     <div class="pbtns"><p>${c.art?"This picture becomes the card's avatar in SillyTavern.":"No picture yet. Cards without one get a plain coloured avatar."}</p>
     <button class="btn sm primary" id="pick">${c.art?"Change picture":"Find a picture"}</button>
     <button class="btn sm" id="pfolder">${ICON.folder} Open art folder</button>
     ${c.art?'<button class="btn sm ghost" id="prem">Remove picture</button>':""}</div></div>
   <p class="label">Default greeting</p><div class="quote" id="dg">Loading…</div>
   <p class="label" style="margin-top:26px">Your greeting</p>
   <textarea class="input" id="cg" placeholder="Write how ${esc(c.name)} should open the chat… Leave empty to use the default.">${esc(S.cfg.greetings[id]||"")}</textarea>
   <p class="hint">Use <code>{{user}}</code> for your persona's name and <code>{{char}}</code> for ${esc(c.name)}'s. Wrap actions in *asterisks* if you like.</p>
   <label class="toggle" style="margin-top:20px"><input type="checkbox" id="kd" ${S.cfg.keep_default?"checked":""}><span class="sw"></span><span><b>Keep the default as an alternate</b><small>Swipe left on the first message in SillyTavern to switch between them. Applies to all characters.</small></span></label></div>
   <div class="actions"><button class="btn ghost" id="clr">Clear</button><button class="btn primary" id="ok">Save greeting</button></div>`;
  $("#scrim").classList.add("on"); D.classList.add("on"); setTimeout(()=>$("#cg").focus(),300);
  api("/api/greeting?tier="+encodeURIComponent(S.cfg.tier)+"&id="+encodeURIComponent(id)).then(r=>$("#dg").textContent=r.greeting||"");
  $("#clr").onclick=()=>{$("#cg").value=""};
  $("#pick").onclick=()=>openPicker(c);
  $("#pfolder").onclick=()=>api("/api/art/open",{slug:c.slug});
  if($("#prem")) $("#prem").onclick=async()=>{const r=await api("/api/art/remove",{slug:c.slug}); c.art=r.art; toast(r.art?"Using the previous picture":"Picture removed (kept in the folder as .removed)"); refreshArt(c)};
  $("#ok").onclick=()=>{const v=$("#cg").value.trim(); if(v){S.cfg.greetings[id]=v; S.cards.add(id)} else delete S.cfg.greetings[id];
    S.cfg.keep_default=$("#kd").checked; save(); closeDrawer(); toast(v?`Greeting saved for ${c.name}`:`${c.name} will use the default greeting`); if(S.step===1) drawTiles(); render(true)};
}
function refreshArt(c){openDrawer(c.id); if(S.step===1) drawTiles()}
function closeDrawer(){$("#scrim").classList.remove("on");$("#drawer").classList.remove("on");S.drawer=null}
$("#scrim").onclick=closeDrawer; document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#picker").classList.contains("on"))closePicker();else closeDrawer()}});

function renderBooks(){
  head("Lorebooks","Shared World Info that wakes up when places, factions or events come up. Each character's own lorebook is always included with their card.");
  const topic=S.bundle.books.filter(b=>b.topic), extra=S.bundle.books.filter(b=>!b.topic);
  const row=b=>`<div class="book ${S.books.has(b.book)?"on":""}" data-b="${esc(b.book)}"><span class="ic">${ICON.book}</span><span class="bt"><b>${esc(b.label)}</b><small>${b.entries} ${b.entries===1?"entry":"entries"} · ~${fmt(b.tokens)} tokens</small></span><span class="check">${ICON.check}</span></div>`;
  const onExtra=extra.filter(b=>S.books.has(b.book)).length;
  $("#body").innerHTML=`<div class="fade">
   <div class="card" style="margin-bottom:22px"><label class="toggle"><input type="checkbox" id="act" ${S.cfg.activate?"checked":""}><span class="sw"></span><span><b>Switch these lorebooks on in SillyTavern for me</b><small>Makes them active for all chats, so you don't have to find the setting. Your settings file is backed up first.</small></span></label></div>
   <div class="row" style="justify-content:space-between"><div class="section-title" style="margin:0">Recommended · ${topic.filter(b=>S.books.has(b.book)).length} of ${topic.length}</div>
     <div class="row"><button class="btn sm" id="ta">Select all</button><button class="btn sm ghost" id="tn">Clear</button></div></div>
   <div class="books" id="topic" style="margin-top:12px">${topic.map(row).join("")}</div>
   ${extra.length?`<details class="more" ${onExtra?"open":""}><summary><span class="chev">${ICON.chev}</span>Extra detail books <span class="pill" style="margin-left:6px">${onExtra} of ${extra.length} selected</span><span style="flex:1"></span><small style="color:var(--dim);font-weight:400">Optional depth for minor figures and places · uses more context</small></summary>
     <div class="inner"><div class="row" style="margin-bottom:12px"><div class="search" style="max-width:none">${ICON.search}<input class="input" id="bq" placeholder="Filter extra books…"></div><button class="btn sm" id="xa">Select shown</button><button class="btn sm ghost" id="xn">Clear shown</button></div>
     <div class="books" id="extra">${extra.map(row).join("")}</div></div></details>`:""}</div>`;
  const bind=el=>el&&(el.onclick=e=>{const b=e.target.closest(".book");if(!b)return;const n=b.dataset.b;S.books.has(n)?S.books.delete(n):S.books.add(n);b.classList.toggle("on");save();render(true)});
  bind($("#topic"));bind($("#extra"));
  $("#act").onchange=e=>{S.cfg.activate=e.target.checked;save()};
  $("#ta").onclick=()=>{topic.forEach(b=>S.books.add(b.book));save();render(true)};
  $("#tn").onclick=()=>{topic.forEach(b=>S.books.delete(b.book));save();render(true)};
  if($("#bq")){
    const shown=()=>[...document.querySelectorAll("#extra .book")].filter(x=>x.style.display!=="none").map(x=>x.dataset.b);
    $("#bq").oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll("#extra .book").forEach(x=>x.style.display=x.dataset.b.toLowerCase().includes(q)?"":"none")};
    $("#xa").onclick=()=>{shown().forEach(n=>S.books.add(n));save();render(true)};
    $("#xn").onclick=()=>{shown().forEach(n=>S.books.delete(n));save();render(true)};
  }
}

function renderImport(){
  if(S.result) return renderDone();
  head("Ready to import","Check the summary, then send everything to SillyTavern.");
  const c=S.stcheck, G=Object.keys(S.cfg.greetings||{}).filter(k=>S.cards.has(k)&&S.cfg.greetings[k].trim()).length;
  const tokens=S.bundle.books.filter(b=>S.books.has(b.book)).reduce((a,b)=>a+b.tokens,0);
  let notes="";
  if(!S.cfg.st) notes+=`<div class="notice bad">${ICON.warn}<div><b>No SillyTavern folder chosen</b><small>Go back to Setup and pick the folder that contains server.js.</small></div></div>`;
  else if(c&&!c.ok) notes+=`<div class="notice bad">${ICON.warn}<div><b>That folder doesn't look like SillyTavern</b><small>${esc(c.error)}</small></div></div>`;
  if(c?.ok){
    if(c.clash.length) notes+=`<div class="notice warn">${ICON.warn}<div><b>${c.clash.length} character${c.clash.length>1?"s":""} already exist${c.clash.length>1?"":"s"} and will be replaced</b><small>${esc(c.clash.slice(0,8).join(", "))}${c.clash.length>8?"…":""}. ${S.cfg.backup?"The old cards are kept as .png.bak files.":"Backups are off."}</small></div></div>`;
    if(c.running&&S.cfg.activate) notes+=`<div class="notice warn">${ICON.warn}<div><b>SillyTavern seems to be running</b><small>Close it before importing so it doesn't overwrite the lorebook settings, then start it again afterwards.</small></div></div>`;
    if(!c.clash.length&&!(c.running&&S.cfg.activate)) notes+=`<div class="notice ok">${ICON.okc}<div><b>All clear</b><small>Nothing will be overwritten.</small></div></div>`;
  }
  $("#body").innerHTML=`<div class="fade">
   <div class="stats4">
     <div class="card stat"><div class="k">Tier</div><div class="v">${esc(S.cfg.tier)}</div><div class="s">${esc((S.tiers.find(t=>t.id===S.cfg.tier)||{}).info||"")}</div></div>
     <div class="card stat"><div class="k">Characters</div><div class="v">${S.cards.size}</div><div class="s">${G} with your own greeting · ${S.bundle.cards.filter(x=>S.cards.has(x.id)&&x.art).length} with your art</div></div>
     <div class="card stat"><div class="k">Lorebooks</div><div class="v">${S.books.size}</div><div class="s">~${fmt(tokens)} tokens of shared lore, plus each character's own</div></div>
     <div class="card stat"><div class="k">Destination</div><div class="v" style="font-size:18px;margin-top:12px">${esc(S.cfg.user)}</div><div class="s path">${esc(S.cfg.st||"not set")}</div></div>
   </div>
   ${notes}
   <div class="section-title">Options</div>
   <div class="card opts">
     <label class="toggle"><input type="checkbox" id="bk" ${S.cfg.backup?"checked":""}><span class="sw"></span><span><b>Back up cards that get replaced</b><small>Keeps a .png.bak copy next to each replaced card.</small></span></label>
     <label class="toggle"><input type="checkbox" id="act2" ${S.cfg.activate?"checked":""}><span class="sw"></span><span><b>Switch the lorebooks on for all chats</b><small>Edits SillyTavern's settings after making a backup.</small></span></label>
     <label class="toggle"><input type="checkbox" id="kd2" ${S.cfg.keep_default?"checked":""}><span class="sw"></span><span><b>Keep default greetings as alternates</b><small>Only matters for characters with your own greeting.</small></span></label>
   </div>
   <div style="display:flex;justify-content:center;margin-top:30px"><button class="btn primary big" id="go" ${!(c?.ok)||(!S.cards.size&&!S.books.size)?"disabled":""}>Import into SillyTavern</button></div></div>`;
  $("#bk").onchange=e=>{S.cfg.backup=e.target.checked;save();render(true)};
  $("#act2").onchange=e=>{S.cfg.activate=e.target.checked;save();render(true)};
  $("#kd2").onchange=e=>{S.cfg.keep_default=e.target.checked;save()};
  $("#go").onclick=async()=>{const b=$("#go");b.disabled=true;b.innerHTML='<span class="spinner"></span> Importing…';
    try{await preparePendingArt(); S.result=await api("/api/import",payload())}
    catch(e){S.result={ok:false,error:"Lost connection to the importer. Close this window and open the importer again."}}
    render()};
}
function renderDone(){
  const r=S.result;
  if(!r.ok){head("Something went wrong","The import didn't finish.");$("#body").innerHTML=`<div class="notice bad">${ICON.warn}<div><b>Import failed</b><small>${esc(r.error)}</small></div></div>`;return}
  head("","");
  $("#body").innerHTML=`<div class="finish fade"><div class="ring">${ICON.done}</div><h3>Ad astra abyssosque!</h3>
   <p>Imported <b style="color:var(--text)">${pl(r.cards,"character")}</b>${r.art?` (${r.art} with your art)`:""} and <b style="color:var(--text)">${pl(r.books,"lorebook")}</b>${r.backgrounds?`, plus ${pl(r.backgrounds,"background")}`:""}. Start SillyTavern (or refresh its tab) and pick a character to begin.</p>
   <div class="row" style="margin:22px 0"><button class="btn" id="again">Import something else</button><button class="btn ghost" id="quit">Close importer</button></div>
   <details style="width:100%;max-width:640px"><summary style="cursor:pointer;color:var(--muted)">Details</summary><pre class="log">${esc(r.log.join("\n"))}</pre></details></div>`;
  $("#again").onclick=()=>{S.result=null;S.step=1;render()};
  $("#quit").onclick=async()=>{await api("/api/quit",{});window.close()};
}
const P={c:null,tab:"wiki",mode:"gallery",img:null,scale:1,min:1,x:0,y:0};
function openPicker(c){
  P.c=c; P.img=null; P.tab="wiki"; P.mode="gallery";
  $("#picker").innerHTML=`<div class="picker"><div class="ph">${avatar(c)}<h3>Choose a picture for ${esc(c.name)}</h3><button class="btn sm ghost" id="pclose">Close</button></div>
   <div class="pb"><div class="left"><div class="tabs" id="ptabs"><button data-t="wiki">Genshin wiki</button><button data-t="web">Google Images</button><button data-t="file">From your computer</button></div><div class="pane" id="pane"></div></div>
   <div class="right"><div class="crop" id="crop"><div class="cempty"><span>Pick a picture on the left, drop one here, or copy any image and press <b>Ctrl+V</b>.</span></div></div>
     <div class="zoom"><span>Zoom</span><input type="range" id="zm" min="1" max="4" step="0.01" value="1" disabled></div>
     <p class="hint" style="text-align:center;margin:0">Drag to move · scroll to zoom. Saved as a 400×600 portrait.</p>
     <button class="btn primary" id="psave" disabled>Save portrait</button></div></div></div>`;
  $("#picker").classList.add("on");
  $("#pclose").onclick=closePicker;
  $("#ptabs").onclick=e=>{const b=e.target.closest("button");if(b){P.tab=b.dataset.t;drawPane()}};
  $("#psave").onclick=savePortrait;
  setupCrop(); drawPane();
}
function closePicker(){$("#picker").classList.remove("on")}
function drawPane(){
  document.querySelectorAll("#ptabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===P.tab));
  const pane=$("#pane"), c=P.c;
  if(P.tab==="wiki"){
    pane.innerHTML=`<div class="row" style="margin-bottom:14px"><div class="search" style="max-width:none">${ICON.search}<input class="input" id="wq" value="${esc(P.q??c.name)}"></div>
      <div class="seg" id="wm"><button data-m="gallery" class="${P.mode==="gallery"?"on":""}">Character gallery</button><button data-m="search" class="${P.mode==="search"?"on":""}">Search all files</button></div></div>
      <div id="gal"><div class="spin2"></div></div>`;
    $("#wq").onkeydown=e=>{if(e.key==="Enter"){P.q=e.target.value;loadWiki()}};
    $("#wm").onclick=e=>{const b=e.target.closest("button");if(b){P.mode=b.dataset.m;P.q=$("#wq").value;drawPane()}};
    loadWiki();
  } else if(P.tab==="web"){
    const q=encodeURIComponent(`${c.name} Genshin Impact`);
    pane.innerHTML=`<div class="drop" id="dz"><b>Find it on Google Images</b>Opens in a separate window. Then either <b style="display:inline">drag the picture</b> into this window, or right-click it → <b style="display:inline">Copy image</b> and press <b style="display:inline">Ctrl+V</b> here.
      <div style="margin-top:18px"><button class="btn primary" id="gopen">Open Google Images</button></div></div>
      <p class="label" style="margin-top:24px">Or paste a picture's web address</p>
      <div class="row"><input class="input" id="purl" placeholder="https://…/picture.png"><button class="btn" id="puse">Use</button></div>`;
    $("#gopen").onclick=()=>window.open(`https://www.google.com/search?tbm=isch&q=${q}`,"_blank","width=1100,height=850");
    $("#puse").onclick=()=>loadUrl($("#purl").value.trim());
  } else {
    pane.innerHTML=`<label class="drop" id="dz" style="display:block;cursor:pointer"><b>Choose a picture file</b>PNG, JPG or WebP. You can also drag a file onto this window.<input type="file" id="pf2" accept="image/png,image/jpeg,image/webp" hidden></label>`;
    $("#pf2").onchange=e=>{const f=e.target.files[0]; if(f) loadBlob(f)};
  }
}
async function loadWiki(){
  const g=$("#gal"); if(!g) return; g.innerHTML='<div class="spin2"></div>';
  const r=await api(`/api/wiki?mode=${P.mode}&q=${encodeURIComponent($("#wq").value)}`);
  if(!r.images){g.innerHTML=`<div class="empty">Couldn't reach the wiki: ${esc(r.error||"")}</div>`;return}
  if(!r.images.length){g.innerHTML=`<div class="empty">No pictures found. Try "Search all files" or another name.</div>`;return}
  g.innerHTML=`<div class="gal">${r.images.map((im,i)=>`<button data-i="${i}" title="${esc(im.title)} (${im.w}×${im.h})"><img loading="lazy" src="${esc(im.thumb)}" referrerpolicy="no-referrer"><small>${esc(im.title)}</small></button>`).join("")}</div>`;
  g.onclick=e=>{const b=e.target.closest("button[data-i]"); if(b) loadUrl(r.images[+b.dataset.i].url)};
}
function loadUrl(u){
  if(!u) return;
  if(u.startsWith("data:")) return loadSrc(u);
  if(!/^https?:\/\//.test(u)) return toast("That doesn't look like a picture link");
  loadSrc(u,"/api/proxy?url="+encodeURIComponent(u));
}
function loadBlob(b){ if(!b.type.startsWith("image/")) return toast("That file isn't a picture"); loadSrc(URL.createObjectURL(b)) }
function loadSrc(src,fallback){
  const crop=$("#crop"); crop.innerHTML='<div class="spin2" style="margin-top:200px"></div>';
  const img=new Image(); img.onload=()=>{P.img=img; crop.innerHTML=""; crop.appendChild(img);
    P.min=Math.max(300/img.naturalWidth,450/img.naturalHeight); P.scale=P.min;
    P.x=(300-img.naturalWidth*P.scale)/2; P.y=Math.min(0,(450-img.naturalHeight*P.scale)*0.15);
    $("#zm").disabled=false; $("#zm").value=1; $("#psave").disabled=false; place()};
  if(/^https?:/.test(src)){img.crossOrigin="anonymous"; img.referrerPolicy="no-referrer"}
  img.onerror=()=>{if(fallback) return loadSrc(fallback); crop.innerHTML='<div class="cempty"><span>Couldn\'t load that picture. Try another one.</span></div>'};
  img.src=src;
}
function place(){
  const i=P.img; if(!i) return; const w=i.naturalWidth*P.scale,h=i.naturalHeight*P.scale;
  P.x=Math.min(0,Math.max(300-w,P.x)); P.y=Math.min(0,Math.max(450-h,P.y));
  i.style.transform=`translate(${P.x}px,${P.y}px) scale(${P.scale})`;
}
function zoomTo(z,cx=150,cy=225){const ns=P.min*z, k=ns/P.scale; P.x=cx-(cx-P.x)*k; P.y=cy-(cy-P.y)*k; P.scale=ns; place()}
function setupCrop(){
  const crop=$("#crop"); let drag=null;
  crop.onpointerdown=e=>{if(!P.img)return; drag={x:e.clientX-P.x,y:e.clientY-P.y}; crop.setPointerCapture(e.pointerId); crop.classList.add("dragging")};
  crop.onpointermove=e=>{if(drag){P.x=e.clientX-drag.x;P.y=e.clientY-drag.y;place()}};
  crop.onpointerup=()=>{drag=null;crop.classList.remove("dragging")};
  crop.onwheel=e=>{if(!P.img)return; e.preventDefault(); const r=crop.getBoundingClientRect(); let z=P.scale/P.min*(e.deltaY<0?1.08:1/1.08); z=Math.min(4,Math.max(1,z)); $("#zm").value=z; zoomTo(z,e.clientX-r.left,e.clientY-r.top)};
  $("#zm").oninput=e=>zoomTo(+e.target.value);
}
async function savePortrait(){
  const cv=document.createElement("canvas"); cv.width=400; cv.height=600; const k=400/300;
  cv.getContext("2d").drawImage(P.img,P.x*k,P.y*k,P.img.naturalWidth*P.scale*k,P.img.naturalHeight*P.scale*k);
  const png=cv.toDataURL("image/png"), b=$("#psave"); b.disabled=true; b.textContent="Saving…";
  const r=await api("/api/art/save",{slug:P.c.slug,png});
  if(!r.ok){toast(r.error||"Couldn't save");b.disabled=false;b.textContent="Save portrait";return}
  P.c.art=r.art; closePicker(); toast(`Portrait saved for ${P.c.name}`); refreshArt(P.c);
}
document.addEventListener("paste",e=>{if(!$("#picker").classList.contains("on"))return;
  const it=[...e.clipboardData.items].find(i=>i.type.startsWith("image/")); if(it){e.preventDefault();return loadBlob(it.getAsFile())}
  const t=e.clipboardData.getData("text"); if(/^(https?:|data:image)/.test(t)&&e.target.id!=="purl"&&e.target.id!=="wq"){e.preventDefault();loadUrl(t.trim())}});
document.addEventListener("dragover",e=>{if($("#picker").classList.contains("on")){e.preventDefault();$("#dz")?.classList.add("over")}});
document.addEventListener("dragleave",e=>{if(!e.relatedTarget)$("#dz")?.classList.remove("over")});
document.addEventListener("drop",e=>{if(!$("#picker").classList.contains("on"))return; e.preventDefault(); $("#dz")?.classList.remove("over");
  const f=[...e.dataTransfer.files].find(f=>f.type.startsWith("image/")); if(f) return loadBlob(f);
  const html=e.dataTransfer.getData("text/html"), m=html&&html.match(/<img[^>]+src="([^"]+)"/i);
  const url=(m&&m[1].replace(/&amp;/g,"&"))||e.dataTransfer.getData("text/uri-list").split("\n")[0]||e.dataTransfer.getData("text/plain");
  if(url) loadUrl(url.trim()); else toast("Couldn't read that picture. Try copy and Ctrl+V instead.")});

async function preparePendingArt(){
  const r=await api("/api/art/pending"); for(const p of r.pending||[]){
    await new Promise(res=>{const img=new Image(); img.onload=async()=>{const cv=document.createElement("canvas"); cv.width=img.naturalWidth; cv.height=img.naturalHeight;
      cv.getContext("2d").drawImage(img,0,0); await api("/api/art/cache",{slug:p.slug,png:cv.toDataURL("image/png")}); res()}; img.onerror=res; img.src=p.url});
  }
}
init();
</script>
</body>
</html>
